# Local PostgreSQL for development:  docker compose up -d db
services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: gridweave
      POSTGRES_PASSWORD: gridweave_dev
      POSTGRES_DB: gridweave
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gridweave -d gridweave"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
